[workspace]

[package]
name = "zap-desktop"
version = "1.0.14"
edition = "2021"
description = "Zap desktop shell"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# 单实例：再点一次图标只聚焦已有窗口，而不是再开一个（否则会出现两个 Zap 窗口）。
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
