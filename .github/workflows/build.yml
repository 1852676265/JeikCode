name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 自动抢占与防重：每个 Tag 独立独占运行，新提交自动取消同 Tag 的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # --- 前置门禁：严格检查当前版本是否大于上一个发布版本，不大于则直接终止流水线 ---
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check version gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/check-version-gate.js "$TAG_NAME" "$REPO"

  build-webui:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # WebUI 侧栏版本号在 `vite build` 时从 Cargo.toml / JEIKCODE_VERSION 烘进 JS。
      # Rust job 的 Tag 注入发生在本步之后，这里必须先注入，否则发布品侧栏会止步于工作区里的旧 version。
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml + JEIKCODE_VERSION to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "JEIKCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build WebUI
        run: |
          cd webui
          npm ci
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  # --- Windows 构建：x86_64 架构编译 ---
  build-windows:
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: "build-target-${{ matrix.target }}"

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          CURRENT_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CURRENT_VER" != "$VERSION" ]; then
            echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          fi

      - name: Build Windows ${{ matrix.arch }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare Windows ${{ matrix.arch }} binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-${{ matrix.arch }}.exe

      - name: Upload Windows CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-${{ matrix.arch }}
          path: dist/jeikcode-*
          if-no-files-found: error

  # Windows CLI 编译完成之后创建一次 Release。清单是 Release 资产，不回写 main。
  publish:
    name: Publish release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Write manifest, changelog, and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/publish-release.js --tag "$TAG_NAME" --dist dist --root .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JeikCode ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist/jeikcode-*
            dist/latest.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 桌面安装包 (Windows x64 NSIS 向导)
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64 (nsis)
            os: windows-latest
            artifact: cli-windows-x64
            cli: jeikcode-${{ github.ref_name }}-windows-x64.exe
            bundles: nsis
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.os }}-${{ matrix.rust_target || 'default' }}
          shared-key: "desktop-${{ matrix.os }}-${{ matrix.rust_target || 'default' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli-dist

      - name: Stage CLI into the desktop bundle
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cp "cli-dist/${{ matrix.cli }}" desktop/src-tauri/resources/cli-bin
          chmod +x desktop/src-tauri/resources/cli-bin || true

      - name: Sync desktop version from the tag
        shell: bash
        env:
          VER: ${{ github.ref_name }}
          PYTHONUTF8: "1"
        run: |
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, pathlib, re
          ver = os.environ["VER"]
          if ver.startswith("v"):
              ver = ver[1:]
          conf = pathlib.Path("desktop/src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text(encoding="utf-8"))
          data["version"] = ver
          conf.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          cargo = pathlib.Path("desktop/src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^version = ".*"', f'version = "{ver}"', text, count=1)
          cargo.write_text(text, encoding="utf-8")
          PY

      - name: Build desktop installers
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload desktop installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
