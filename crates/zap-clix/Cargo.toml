[package]
name = "zap-clix"
version.workspace = true
edition = "2021"
description = "Standalone new-stack CLI (D-layer driver): `code` drives the full coding agent (prepare/assemble), `review` drives the zap-review agent over a git diff. Decoupled from zap-cli."

[[bin]]
name = "zapx"
path = "src/main.rs"

[dependencies]
zap-review = { path = "../zap-review" }
zap-coding = { path = "../zap-coding" }
# Direct dep for the D-layer pieces the driver owns: MemoryStore (slash commands),
# the typed approval wire contract, SessionManager (session listing).
zap-capabilities = { path = "../zap-capabilities", features = ["provider", "tools", "session", "memory", "mcp"] }
zap-kernel = { path = "../zap-kernel" }
zap-config = { path = "../zap-config" }
# Standalone telemetry sink (clix is core-decoupled, so it resolves + inits its own,
# mirroring zap-cli) — feeds LlmChat/ToolCall events for both subcommands.
zap-telemetry = { path = "../zap-telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Capturable in-memory telemetry sink + a canned provider stream for the metering test.
zap-telemetry = { path = "../zap-telemetry", features = ["test-util"] }
futures = "0.3"
async-trait = "0.1"
