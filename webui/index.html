<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('jeikcode.theme');
          if (t === 'light' || t === 'dark' || t === 'system') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>JeikCode - Open-Source AI Coding Agent</title>
    <meta
      name="description"
      content="JeikCode is a high-performance, Rust-powered open-source AI Coding Agent featuring CodeExplore semantic graphs, append-only KV cache protection, Git-like atomic state machines, and 9k minimal prompts."
    />
    <meta property="og:title" content="JeikCode - Open-Source AI Coding Agent" />
    <meta
      property="og:description"
      content="High-performance, Rust-powered open-source AI Coding Agent driven by CodeExplore semantic graphs and append-only KV cache protection."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
