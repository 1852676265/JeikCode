<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zap.theme') || localStorage.getItem('jeikcode.theme');
          if (t === 'light' || t === 'dark' || t === 'system') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Zap - 瞬息击发的开源 AI 编程智能体</title>
    <meta
      name="description"
      content="Zap 是极速高能的开源 AI 编程智能体：基于纯 Rust 原生打造，原生语义代码图谱与极致缓存保护！"
    />
    <meta property="og:title" content="Zap - 瞬息击发的开源 AI 编程智能体" />
    <meta
      property="og:description"
      content="Zap 是极速高能的开源 AI 编程智能体：基于纯 Rust 原生打造，原生语义代码图谱与极致缓存保护！"
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zap" />
    <meta name="theme-color" content="#18181b" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
