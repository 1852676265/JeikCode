<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 1. Obsidian Deep Space Background -->
    <linearGradient id="zapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- 2. Electric Perimeter Glow Border (Neon Cyan to Hyper Violet to Amber Gold) -->
    <linearGradient id="zapBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3. Z-Lightning Top Wing Gradient (Sleek Cyan to Ice Blue) -->
    <linearGradient id="topWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 4. Z-Lightning Main Diagonal - Light/Glossy Facet (Superconductor Cyan to Neon Blue) -->
    <linearGradient id="diagFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 5. Z-Lightning Main Diagonal - Dark/Shadow Facet (Deep Violet to Indigo) -->
    <linearGradient id="diagFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- 6. Z-Lightning Bottom Wing Gradient (Electric Purple to Fiery Amber Spark) -->
    <linearGradient id="bottomWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 7. Graph Line Ambient Glow -->
    <linearGradient id="graphLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- 8. Soft High-Tech Ambient Blur -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- 9. Core Lightning Bloom Glow -->
    <filter id="boltBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 10. Star Spark Flare Filter -->
    <filter id="sparkFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== 1. SQUIRCLE CANVAS ==================== -->
  <rect width="512" height="512" rx="114" fill="url(#zapBg)" />
  <rect width="504" height="504" x="4" y="4" rx="110" fill="none" stroke="url(#zapBorder)" stroke-width="2.5" />

  <!-- ==================== 2. AMBIENT FIELD LIGHTS ==================== -->
  <circle cx="210" cy="180" r="140" fill="#00f5ff" opacity="0.16" filter="url(#ambientGlow)" />
  <circle cx="310" cy="330" r="150" fill="#8b5cf6" opacity="0.22" filter="url(#ambientGlow)" />
  <circle cx="360" cy="160" r="90" fill="#ec4899" opacity="0.12" filter="url(#ambientGlow)" />

  <!-- ==================== 3. CODEGRAPH AST CONSTELLATION ==================== -->
  <!-- Subtle background AST network lines indicating the Semantic CodeGraph engine -->
  <g opacity="0.45">
    <!-- Graph Links -->
    <line x1="120" y1="130" x2="190" y2="105" stroke="url(#graphLineGrad)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="190" y1="105" x2="310" y2="105" stroke="url(#graphLineGrad)" stroke-width="1.5" />
    <line x1="310" y1="105" x2="400" y2="160" stroke="url(#graphLineGrad)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="400" y1="160" x2="385" y2="270" stroke="url(#graphLineGrad)" stroke-width="1.5" />
    <line x1="120" y1="360" x2="135" y2="250" stroke="url(#graphLineGrad)" stroke-width="1.5" />
    <line x1="135" y1="250" x2="210" y2="405" stroke="url(#graphLineGrad)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="210" y1="405" x2="340" y2="405" stroke="url(#graphLineGrad)" stroke-width="1.5" />
    <line x1="340" y1="405" x2="405" y2="365" stroke="url(#graphLineGrad)" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Graph Nodes -->
    <circle cx="120" cy="130" r="3.5" fill="#00f5ff" opacity="0.7" />
    <circle cx="190" cy="105" r="4.5" fill="#38bdf8" />
    <circle cx="400" cy="160" r="3.5" fill="#a855f7" opacity="0.8" />
    <circle cx="385" cy="270" r="3" fill="#ec4899" opacity="0.6" />
    <circle cx="135" cy="250" r="3" fill="#00f5ff" opacity="0.6" />
    <circle cx="210" cy="405" r="4" fill="#8b5cf6" />
    <circle cx="405" cy="365" r="4.5" fill="#f59e0b" />
  </g>

  <!-- ==================== 4. THE ZAP CORE LIGHTNING EMBLEM ==================== -->
  <!-- Sculpted 3D faceted Z with hyper-clean speed geometry -->
  <g filter="url(#boltBloom)">

    <!-- BACK SHADOW VOLUME: Gives the 3D extrusion depth -->
    <path d="M 374 122
             L 216 312
             L 262 312
             L 156 414
             L 142 400
             L 226 300
             L 178 300
             L 340 106
             Z" 
          fill="#0c102b" opacity="0.8" />

    <!-- FACET 1: Upper Horizontal Wing (High-speed arrow cutting right) -->
    <!-- Points: [TopLeft (126, 126), FarTopRight (386, 126), InnerKink (250, 196), LeftNotch (186, 196)] -->
    <path d="M 132 134
             C 140 128, 150 126, 164 126
             L 378 126
             C 388 126, 394 135, 388 143
             L 358 178
             C 354 184, 346 188, 338 188
             L 230 188
             L 278 134
             Z"
          fill="url(#topWingGrad)" />

    <!-- FACET 2: Main Diagonal Chiseled Spine - Glossy Bevel (Sunlit Razor Edge) -->
    <path d="M 378 126
             L 182 358
             L 222 358
             L 150 422
             C 142 428, 134 424, 138 414
             L 180 340
             C 184 332, 192 328, 202 328
             L 288 328
             L 388 143
             C 392 136, 386 126, 378 126 Z"
          fill="url(#diagFacetLight)" />

    <!-- FACET 3: Main Diagonal Chiseled Spine - Shadow Bevel (Canyon Deep Core) -->
    <path d="M 288 188
             L 182 328
             L 242 328
             L 174 402
             L 348 202
             L 296 202
             Z"
          fill="url(#diagFacetDark)" />

    <!-- FACET 4: Bottom Horizontal Wing (Grounded Kinetic Return) -->
    <path d="M 148 418
             C 142 418, 138 412, 142 404
             L 174 366
             C 178 360, 186 356, 194 356
             L 334 356
             C 348 356, 356 364, 350 374
             L 326 406
             C 320 414, 310 418, 298 418
             Z"
          fill="url(#bottomWingGrad)" />

    <!-- FACET 5: Superconductor Core Energy Trench (The internal white-hot laser seam) -->
    <path d="M 358 146
             L 214 316
             L 264 316
             L 168 406"
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9" />

    <!-- Subtle inner neon micro-stroke -->
    <path d="M 358 146
             L 214 316
             L 264 316
             L 168 406"
          fill="none" 
          stroke="#00f5ff" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.45" />
  </g>

  <!-- ==================== 5. ZAP SPARK HIGHLIGHTS (FLARES) ==================== -->
  <g filter="url(#sparkFlare)">
    <!-- High-energy collision spark at top right corner -->
    <circle cx="362" cy="144" r="5" fill="#ffffff" />
    <polygon points="362,130 365,141 376,144 365,147 362,158 359,147 348,144 359,141" fill="#ffffff" opacity="0.95" />

    <!-- White-hot center spark in the inflection throat -->
    <circle cx="214" cy="316" r="4.5" fill="#ffffff" />
    <polygon points="214,306 216,314 224,316 216,318 214,326 212,318 204,316 212,314" fill="#00f5ff" opacity="0.9" />

    <!-- Rust-Orange kinetic spark at bottom tip -->
    <circle cx="328" cy="404" r="3.5" fill="#fef08a" />
    <polygon points="328,395 330,402 337,404 330,406 328,413 326,406 319,404 326,402" fill="#f59e0b" opacity="0.85" />
  </g>
</svg>
