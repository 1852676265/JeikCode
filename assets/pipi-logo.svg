<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Canvas Border Glow (Amber to Cyan Dual Color) -->
    <linearGradient id="catBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.85" />
    </linearGradient>

    <!-- Pipi: Warm Gold / Amber Cat Gradient -->
    <linearGradient id="pipiFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Paotui: Sleek Cyber Night / Cyan Cat Gradient -->
    <linearGradient id="paotuiFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Ear Inner Pink Gradient -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Code Core Glowing Sphere -->
    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Soft Ambient Glow Filters -->
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48" />
    </filter>
  </defs>

  <!-- 1. Apple-style Squircle Canvas -->
  <rect width="512" height="512" rx="114" fill="url(#catBg)" />
  <rect width="504" height="504" x="4" y="4" rx="110" fill="none" stroke="url(#catBorder)" stroke-width="2.5" />

  <!-- 2. Dual Warm/Cool Ambient Lights -->
  <circle cx="180" cy="220" r="140" fill="#f59e0b" opacity="0.16" filter="url(#ambientLight)" />
  <circle cx="340" cy="220" r="140" fill="#00f2fe" opacity="0.18" filter="url(#ambientLight)" />

  <!-- 3. The Dual Cat Duo: Pipi (Left, Warm Gold) & Paotui (Right, Cool Cyber) -->
  <g filter="url(#catGlow)">

    <!-- ==================== CAT 1: 皮皮 (PIPI) - 左侧暖金猫 ==================== -->
    <g id="pipi">
      <!-- Left Ear (Outer + Inner) -->
      <polygon points="120,116 160,204 96,188" fill="url(#pipiFur)" />
      <polygon points="124,136 150,196 108,186" fill="url(#earPink)" opacity="0.85" />

      <!-- Right Ear -->
      <polygon points="236,128 244,212 188,196" fill="url(#pipiFur)" />
      <polygon points="230,146 238,202 198,192" fill="url(#earPink)" opacity="0.85" />

      <!-- Head Base -->
      <path d="M106,204 C84,248 98,310 148,340 C178,358 220,354 246,328 C266,308 268,266 260,224 C244,188 152,176 106,204 Z" 
            fill="url(#pipiFur)" />

      <!-- Forehead Striped Markings (橘猫可爱花纹) -->
      <path d="M168,172 L172,192 M182,168 L184,194 M196,172 L194,192" 
            stroke="#c2410c" stroke-width="3" stroke-linecap="round" />

      <!-- Left Eye (Big cute curious anime cat eye) -->
      <ellipse cx="148" cy="248" rx="15" ry="20" fill="#0f172a" />
      <circle cx="144" cy="242" r="6" fill="#ffffff" />
      <circle cx="154" cy="256" r="3" fill="#ffffff" />

      <!-- Right Eye (Winking happily! 半眯欢笑的大眼) -->
      <path d="M204,246 Q220,234 234,248" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />

      <!-- Pink Nose & Cheerful Cat Smile (猫猫嘴巴 3 形状) -->
      <polygon points="184,272 178,264 190,264" fill="#f43f5e" />
      <path d="M174,276 Q184,284 184,274 Q184,284 194,276" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" />

      <!-- Sweet Cheeks (腮红) -->
      <ellipse cx="134" cy="274" rx="10" ry="6" fill="#f43f5e" opacity="0.4" />
      <ellipse cx="228" cy="274" rx="10" ry="6" fill="#f43f5e" opacity="0.4" />

      <!-- Cute Whiskers (胡子) -->
      <line x1="124" y1="264" x2="88" y2="258" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
      <line x1="122" y1="274" x2="84" y2="276" stroke-width="2.5" stroke-linecap="round" stroke="#fef08a" />
    </g>


    <!-- ==================== CAT 2: 跑腿 (PAOTUI) - 右侧机灵青蓝猫 ==================== -->
    <g id="paotui">
      <!-- Left Ear -->
      <polygon points="280,128 328,196 270,212" fill="url(#paotuiFur)" />
      <polygon points="286,146 316,192 278,202" fill="url(#earPink)" opacity="0.85" />

      <!-- Right Ear -->
      <polygon points="396,116 418,188 356,204" fill="url(#paotuiFur)" />
      <polygon points="390,136 406,186 364,196" fill="url(#earPink)" opacity="0.85" />

      <!-- Head Base -->
      <path d="M266,224 C256,266 260,308 280,328 C306,354 348,358 378,340 C428,310 442,248 420,204 C374,176 282,188 266,224 Z" 
            fill="url(#paotuiFur)" />

      <!-- Sleek Cyber Visor / Glasses on Paotui (跑腿戴着酷酷的青蓝极客发光墨镜) -->
      <path d="M288,232 C308,224 376,224 402,236 C408,239 410,248 406,254 L400,264 C396,270 388,272 382,270 C344,260 306,260 292,268 C286,270 280,266 278,260 L276,250 C274,242 280,235 288,232 Z" 
            fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" />
      
      <!-- Visor Cyan Reflection with tiny code </> -->
      <path d="M292,238 L340,236 L332,258 L286,252 Z" fill="#00f2fe" opacity="0.4" />
      <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
        <path d="M338,244 L332,249 L338,254" />
        <line x1="344" y1="242" x2="340" y2="256" />
        <path d="M346,244 L352,249 L346,254" />
      </g>

      <!-- Pink Nose & Eager Open Mouth (跑腿充满干劲的吐舌欢笑) -->
      <polygon points="340,284 334,276 346,276" fill="#f43f5e" />
      <path d="M330,286 Q340,294 340,284 Q340,294 350,286" fill="none" stroke="#082f49" stroke-width="3" stroke-linecap="round" />
      <!-- Tiny Happy Tongue (小猫吐舌) -->
      <path d="M336,290 C336,298 344,298 344,290 Z" fill="#f43f5e" />

      <!-- Cute Whiskers (跑腿的胡子) -->
      <line x1="392" y1="274" x2="430" y2="268" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="394" y1="284" x2="434" y2="286" stroke-width="2.5" stroke-linecap="round" stroke="#38bdf8" />
    </g>


    <!-- ==================== CAT PAWS & CODE SPARK (双猫击掌与代码核心) ==================== -->
    <g id="interaction">
      <!-- Pipi's Paw (左边橘猫的小肉爪) -->
      <ellipse cx="206" cy="384" rx="26" ry="18" fill="#fbbf24" stroke="#c2410c" stroke-width="2" />
      <!-- Paotui's Paw (右边蓝猫的小肉爪) -->
      <ellipse cx="306" cy="384" rx="26" ry="18" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />

      <!-- Floating Prismatic Code Sphere in Between (两只猫猫中间发光的智能代码微粒) -->
      <circle cx="256" cy="378" r="32" fill="url(#coreGlowGrad)" opacity="0.95" />
      <circle cx="256" cy="378" r="42" fill="#00f2fe" opacity="0.3" filter="url(#catGlow)" />

      <!-- Glowing Code Bracket < / > on Central Core -->
      <g stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M242,368 L232,378 L242,388" />
        <line x1="254" y1="365" x2="248" y2="391" stroke-width="3.5" />
        <path d="M258,368 L268,378 L258,388" />
      </g>

      <!-- Floating Star Sparks around Duo (双猫周围的小灵动星星) -->
      <polygon points="120,380 124,390 134,394 124,398 120,408 116,398 106,394 116,390" fill="#fbbf24" opacity="0.8" />
      <polygon points="396,370 400,380 410,384 400,388 396,398 392,388 382,384 392,380" fill="#00f2fe" opacity="0.8" />
      <polygon points="256,128 260,138 270,142 260,146 256,156 252,146 242,142 252,138" fill="#ffffff" opacity="0.9" />
    </g>

  </g>
</svg>
